name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time: racing runs would fight over the same release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN: this repository forbids
      # Actions-created PRs, and a GITHUB_TOKEN PR would not run CI, which
      # branch protection requires before the release PR can merge.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

name: Release Please

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".vscode/**", ".idea/**"]

permissions:
  contents: read

# Run one release-please workflow at a time so runs do not update the same release PR together.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Use RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN. This repository blocks PRs created by Actions.
      # A PR created with GITHUB_TOKEN would not run CI, which branch protection requires before
      # the release PR can merge.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

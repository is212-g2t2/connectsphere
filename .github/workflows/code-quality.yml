name: Code Quality

on:
  workflow_call:
  pull_request:
    # Not a default activity type; without it, marking a draft ready starts no run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".idea/**"

permissions:
  contents: read

# Literal, not `github.workflow`: a called workflow sees the caller's name.
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Lint, type check, and build
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Check formatting
        run: bun run format:check
      - name: Check linting and types
        run: bun run lint:check
      - name: Check types
        run: bun run type:check
      - name: Check migrations are generated
        run: bun run db:generate && git diff --exit-code -- src/db/drizzle
        env:
          # generate only reads the schema; both vars satisfy drizzle.config.ts's import
          # of src/env.ts.
          DATABASE_URL: postgresql://postgres:password@localhost:5432/app
          BETTER_AUTH_SECRET: connectsphere-migration-only-secret-0000
      - name: Check migration files
        run: bunx drizzle-kit check
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/app
          BETTER_AUTH_SECRET: connectsphere-migration-only-secret-0000
      - name: Build for production
        run: bun run build

name: E2E Tests

on:
  workflow_call:
  pull_request:
    # Not a default activity type; without it, marking a draft ready starts no run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".idea/**"

permissions:
  contents: read

# Literal, not `github.workflow`: a called workflow sees the caller's name.
concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:8025/api/v1/info"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run E2E tests
        # globalSetup starts its own postgres testcontainer (random port, migrated and seeded)
        # and a production server on :3000 against it, so Docker must be reachable here — hence
        # no job container. Mailpit comes from the services above.
        run: bun run test:e2e
        env:
          BETTER_AUTH_SECRET: "12345678901234567890123456789012"
          BETTER_AUTH_URL: "http://localhost:3000"
          # Mail capture for the password-reset journey.
          SMTP_URL: smtp://127.0.0.1:1025
          MAILPIT_URL: http://127.0.0.1:8025
          # The notification email worker's bearer; E2E drains the queue through its route.
          CRON_TOKEN: e2e-cron-token
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
      - name: Report Playwright results
        # Public action over the JSON reporter: writes the job summary, no local script.
        uses: daun/playwright-report-summary@v4
        if: ${{ always() }}
        with:
          report-file: test-results/results.json
          job-summary: true
          create-comment: false
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 3

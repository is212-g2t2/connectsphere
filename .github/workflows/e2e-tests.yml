name: E2E Tests

on:
  workflow_call:
  pull_request:
    # This activity type is not enabled by default. Include it so marking a draft ready starts a run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "scripts/seed.ts"
      - "vite.config.ts"
      - "instrument.server.mjs"
      - "drizzle.config.ts"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"
      # GitHub rejects `paths` with `paths-ignore` on one event. List
      # exclusions here with `!`. Negations follow inclusions.
      - "!**.md"
      - "!docs/**"
      - "!.vscode/**"
      - "!.idea/**"

permissions:
  contents: read

# Set a literal name because a called workflow sees the caller's name in `github.workflow`.
concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    services:
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:8025/api/v1/info"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run E2E tests
        # globalSetup starts a Postgres test container on a random port, then migrates and seeds it.
        # It also starts a production server on port 3000 against that database. Docker must be
        # reachable from this job, so do not use a job container. Mailpit runs as a service above.
        run: bun run test:e2e -- --shard=${{ matrix.shard }}
        env:
          BETTER_AUTH_SECRET: "12345678901234567890123456789012"
          BETTER_AUTH_URL: "http://localhost:3000"
          # Mail capture for the password-reset journey.
          SMTP_URL: smtp://127.0.0.1:1025
          MAILPIT_URL: http://127.0.0.1:8025
          # Bearer token for the notification email worker. E2E drains the queue through its route.
          CRON_TOKEN: e2e-cron-token
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 3
      - name: Report Playwright results
        # This public action reads the JSON reporter and writes the job summary. No local script is needed.
        uses: daun/playwright-report-summary@v4
        if: ${{ always() }}
        with:
          report-file: test-results/results.json
          job-summary: true
          create-comment: false
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: e2e-test-results-${{ strategy.job-index }}
          path: test-results/
          retention-days: 3

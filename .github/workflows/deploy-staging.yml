name: Deploy Staging

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".idea/**"

permissions:
  contents: read

# Do not cancel a deployment while it is running.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  code-quality:
    uses: ./.github/workflows/code-quality.yml
    permissions:
      contents: read

  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      contents: read

  integration-tests:
    uses: ./.github/workflows/integration-tests.yml
    permissions:
      contents: read

  e2e-tests:
    uses: ./.github/workflows/e2e-tests.yml
    permissions:
      contents: read

  # CodeQL needs `actions: read` and `security-events: write`. A called workflow can only reduce
  # the caller's token permissions. Without these permissions, CodeQL gets `none` and the release
  # stops at the check stage.
  security-checks:
    uses: ./.github/workflows/security-checks.yml
    permissions:
      contents: read
      actions: read
      security-events: write
    # The security workflow reads GITLEAKS_LICENSE but does not list it under
    # `on.workflow_call.secrets`. Pass the caller's secrets so the workflow can read it.
    secrets: inherit

  deploy:
    name: Deploy staging
    needs: [code-quality, unit-tests, integration-tests, e2e-tests, security-checks]
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      service: connectsphere-staging
      environment: staging
      secret_prefix: staging
      require_existing_image: false
    # Inherit secrets instead of naming them. The migrate job's DATABASE_URL_SESSION is an
    # environment secret, which is available only through inheritance.
    secrets: inherit

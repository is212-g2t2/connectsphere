name: Deploy Production

on:
  release:
    types: [published]

permissions:
  contents: read

# Do not cancel a deployment while it is running. rollback.yml uses this concurrency group too.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      service: connectsphere
      environment: production
      secret_prefix: prod
      require_existing_image: true
    # Inherit secrets instead of naming them. The migrate job's DATABASE_URL_SESSION is an
    # environment secret, which is available only through inheritance.
    secrets: inherit

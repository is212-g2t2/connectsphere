name: Integration Tests

on:
  workflow_call:
  pull_request:
    # This activity type is not enabled by default. Include it so marking a draft ready starts a run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/integration/**"
      - "tests/setup.ts"
      - "tests/shims/**"
      - "scripts/seed.ts"
      - "drizzle.config.ts"
      - "vitest.config.ts"
      - "package.json"
      - "bun.lock"
      # GitHub rejects `paths` with `paths-ignore` on one event. List
      # exclusions here with `!`. Negations follow inclusions.
      - "!**.md"
      - "!docs/**"
      - "!.vscode/**"
      - "!.idea/**"

permissions:
  contents: read

# Set a literal name because a called workflow sees the caller's name in `github.workflow`.
concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Run integration tests
        # tests/integration/integration-setup.ts supplies DATABASE_URL. Testcontainers applies
        # committed migrations through drizzle.config.ts, which imports src/env.ts and requires a
        # BETTER_AUTH_SECRET of at least 32 characters. Set it here so an .env.example placeholder
        # cannot hide a missing secret.
        env:
          BETTER_AUTH_SECRET: "12345678901234567890123456789012"
        run: bun run test:integration -- --shard=${{ matrix.shard }} --coverage.enabled=false

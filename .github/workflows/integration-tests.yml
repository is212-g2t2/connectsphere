name: Integration Tests

on:
  workflow_call:
  pull_request:
    # This activity type is not enabled by default. Include it so marking a draft ready starts a run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".idea/**"

permissions:
  contents: read

# Set a literal name because a called workflow sees the caller's name in `github.workflow`.
concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Run integration tests
        # tests/integration/integration-setup.ts supplies DATABASE_URL. Testcontainers applies
        # committed migrations through drizzle.config.ts, which imports src/env.ts and requires a
        # BETTER_AUTH_SECRET of at least 32 characters. Set it here so an .env.example placeholder
        # cannot hide a missing secret.
        env:
          BETTER_AUTH_SECRET: "12345678901234567890123456789012"
        run: bun run test:integration
      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: integration-test-results
          path: coverage/
          retention-days: 3

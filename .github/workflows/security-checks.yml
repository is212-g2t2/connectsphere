name: Security Checks

on:
  workflow_call:
  pull_request:
    # This activity type is not enabled by default. Include it so marking a draft ready starts a run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".idea/**"
  schedule:
    - cron: "0 6 * * 1"

# Set a literal name because a called workflow sees the caller's name in `github.workflow`.
# Otherwise, all five checks would share one group. The event name prevents the weekly schedule
# from cancelling a main release that uses the same ref.
concurrency:
  group: security-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-audit:
    name: Dependency audit
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Audit dependencies
        # braces@3.0.3 has no patched release (GHSA-vfj7-8cjw-p6xm; micromatch/braces#70).
        # shadcn's fast-glob chain is the only dependency that uses it. Remove this ignore when
        # that chain uses a patched braces release.
        run: bun audit --audit-level=moderate --ignore=GHSA-vfj7-8cjw-p6xm

  codeql:
    name: CodeQL
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

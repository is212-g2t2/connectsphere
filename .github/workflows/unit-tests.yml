name: Unit Tests

on:
  workflow_call:
  pull_request:
    # This activity type is not enabled by default. Include it so marking a draft ready starts a run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/unit/**"
      - "tests/setup.ts"
      - "tests/shims/**"
      - "vitest.config.ts"
      - "package.json"
      - "bun.lock"
      # GitHub rejects `paths` with `paths-ignore` on one event. List
      # exclusions here with `!`. Negations follow inclusions.
      - "!**.md"
      - "!docs/**"
      - "!.vscode/**"
      - "!.idea/**"

permissions:
  contents: read

# Set a literal name because a called workflow sees the caller's name in `github.workflow`.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Run unit tests
        # Coverage gates live in vitest.config.ts. Collect it here so a PR cannot
        # lower coverage while the tests pass.
        env:
          COVERAGE: "1"
        run: bun run test:unit
      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: unit-test-results
          path: coverage/
          retention-days: 3

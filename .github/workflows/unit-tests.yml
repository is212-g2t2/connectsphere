name: Unit Tests

on:
  workflow_call:
  # `ready_for_review` is not a default activity type, so without it marking a
  # draft ready would start no run. Drafts are gated off at the job level with
  # the negated condition: `draft` is absent on workflow_call and schedule
  # events, where `== false` would wrongly skip the jobs.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".idea/**"

permissions:
  contents: read

# Literal, not `github.workflow`: a called workflow sees the caller's name.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Run unit tests
        run: bun run test:unit
